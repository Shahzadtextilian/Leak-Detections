<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="60%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="dropGrad" x1="20%" y1="10%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#93c5fd" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Squircle Base Container -->
  <rect x="3" y="3" width="58" height="58" rx="16" ry="16" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" filter="url(#shadow)" />

  <!-- Acoustic Sonar Pulse Waves (Left & Right) -->
  <path d="M19 26 C16 30 16 36 19 40" fill="none" stroke="#67e8f9" stroke-width="2.5" stroke-linecap="round" opacity="0.85" />
  <path d="M14 22 C9 28 9 38 14 44" fill="none" stroke="#67e8f9" stroke-width="2" stroke-linecap="round" opacity="0.5" />

  <path d="M45 26 C48 30 48 36 45 40" fill="none" stroke="#67e8f9" stroke-width="2.5" stroke-linecap="round" opacity="0.85" />
  <path d="M50 22 C55 28 55 38 50 44" fill="none" stroke="#67e8f9" stroke-width="2" stroke-linecap="round" opacity="0.5" />

  <!-- Main Water Droplet Shape -->
  <path d="M32 15 C32 15 21 29 21 37.5 C21 43.8 25.9 49 32 49 C38.1 49 43 43.8 43 37.5 C43 29 32 15 32 15 Z" fill="url(#dropGrad)" />

  <!-- Droplet Gloss / Highlight -->
  <path d="M28 27 C26 31 25.5 35 27 39 C25 37 24.5 33 26 28 C26.7 25.5 28 24 28 24 C28 24 28.5 25.5 28 27 Z" fill="url(#glowGrad)" opacity="0.9" />

  <!-- Center Locator Dot (Precision Leak Pinpoint) -->
  <circle cx="32" cy="38" r="2.5" fill="#1e3a8a" />
</svg>
